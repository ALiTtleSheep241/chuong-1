<script>
const r=String.raw;
const D=[
{q:r`Đại lượng nào sau đây là đại lượng vô hướng?`,o:[r`Lực`,r`Vận tốc`,r`Khối lượng`,r`Cường độ điện trường`],a:2,e:r`Vô hướng chỉ đặc trưng bởi độ lớn (nhiệt độ, khối lượng, điện tích). Lực, vận tốc, cường độ điện trường là vectơ.`},
{q:r`Vectơ là đại lượng vật lý được đặc trưng bởi:`,o:[r`Chỉ độ lớn`,r`Chỉ hướng`,r`Chỉ điểm đặt`,r`Cả độ lớn và hướng`],a:3,e:r`Vectơ đặc trưng bởi cả độ lớn và hướng của nó.`},
{q:r`Trong hệ tọa độ trụ, yếu tố vi phân đường \(d\vec{l}\) bằng:`,o:[r`\(dr\,\vec{i}_r+d\phi\,\vec{i}_\phi+dz\,\vec{i}_z\)`,r`\(dr\,\vec{i}_r+r\,d\phi\,\vec{i}_\phi+dz\,\vec{i}_z\)`,r`\(dr\,\vec{i}_r+r\,d\theta\,\vec{i}_\theta+r\sin\theta\,d\phi\,\vec{i}_\phi\)`,r`\(dx\,\vec{i}_x+dy\,\vec{i}_y+dz\,\vec{i}_z\)`],a:1,e:r`Hệ trụ: \(d\vec{l}=dr\,\vec{i}_r+r\,d\phi\,\vec{i}_\phi+dz\,\vec{i}_z\).`},
{q:r`Trong hệ tọa độ cầu, yếu tố vi phân thể tích \(dV\) bằng:`,o:[r`\(r\,dr\,d\phi\,dz\)`,r`\(r^2\,dr\,d\theta\,d\phi\)`,r`\(r^2\sin\theta\,dr\,d\theta\,d\phi\)`,r`\(dx\,dy\,dz\)`],a:2,e:r`Hệ cầu: \(dV=r^2\sin\theta\,dr\,d\theta\,d\phi\).`},
{q:r`Toán tử gradient tác dụng lên một hàm vô hướng cho kết quả là:`,o:[r`Một hàm vô hướng`,r`Một hàm vectơ`,r`Một số phức`,r`Một ma trận`],a:1,e:r`Gradient tác dụng lên hàm vô hướng, kết quả là một hàm vectơ.`},
{q:r`Divergence của \(\vec{A}\) được định nghĩa là giới hạn của tỉ số thông lượng \(\oint_S\vec{A}\cdot d\vec{S}\) qua mặt kín chia cho:`,o:[r`Độ dài đường cong`,r`Diện tích mặt`,r`Thể tích \(\Delta V\) (với \(\Delta V\to0\))`,r`Thời gian \(\Delta t\)`],a:2,e:r`\(\mathrm{div}\vec{A}=\nabla\cdot\vec{A}=\displaystyle\lim_{\Delta V\to0}\frac{\oint_S\vec{A}\cdot d\vec{S}}{\Delta V}\)`},
{q:r`Nếu \(\mathrm{div}\vec{A}>0\) thì thông lượng của \(\vec{A}\):`,o:[r`Hướng vào bên trong mặt kín S`,r`Hướng ra bên ngoài mặt kín S`,r`Vào và ra như nhau`,r`Luôn bằng 0 tại mọi điểm`],a:1,e:r`\(\mathrm{div}\vec{A}>0\): thông lượng hướng ra ngoài S; \(\mathrm{div}\vec{A}<0\): hướng vào trong; \(\mathrm{div}\vec{A}=0\): vào và ra như nhau.`},
{q:r`Toán tử rot (curl) mô tả tính chất nào của trường vectơ?`,o:[r`Tính chất thế`,r`Tính chất tuyến tính`,r`Tính chất xoáy`,r`Tính chất đồng nhất`],a:2,e:r`Toán tử rot mô tả tính chất xoáy của trường vectơ.`},
{q:r`Nếu \(\mathrm{rot}\vec{A}=0\) thì trường \(\vec{A}\) được gọi là:`,o:[r`Trường xoáy`,r`Trường thế (không xoáy)`,r`Trường biến thiên`,r`Trường dừng`],a:1,e:r`\(\mathrm{rot}\vec{A}=0\): trường không xoáy, còn gọi là trường thế. \(\mathrm{rot}\vec{A}\neq0\): trường có tính chất xoáy.`},
{q:r`Định lý Stokes được viết là:`,o:[r`\(\oint_S\vec{A}\cdot d\vec{S}=\int_V(\mathrm{div}\vec{A})\,dV\)`,r`\(\oint_C\vec{A}\cdot d\vec{l}=\int_V(\mathrm{div}\vec{A})\,dV\)`,r`\(\oint_C\vec{A}\cdot d\vec{l}=\int_S(\mathrm{rot}\vec{A})\cdot d\vec{S}\)`,r`\(\oint_S\vec{A}\cdot d\vec{S}=\int_S(\mathrm{rot}\vec{A})\cdot d\vec{S}\)`],a:2,e:r`Stokes liên hệ lưu số theo đường kín C với thông lượng của \(\mathrm{rot}\vec{A}\) qua mặt S bao bởi C.`},
{q:r`Định lý Divergence được viết là:`,o:[r`\(\oint_C\vec{A}\cdot d\vec{l}=\int_S(\mathrm{rot}\vec{A})\cdot d\vec{S}\)`,r`\(\oint_C\vec{A}\cdot d\vec{l}=\int_V(\mathrm{div}\vec{A})\,dV\)`,r`\(\oint_S\vec{A}\cdot d\vec{S}=\int_S(\mathrm{rot}\vec{A})\cdot d\vec{S}\)`,r`\(\oint_S\vec{A}\cdot d\vec{S}=\int_V(\mathrm{div}\vec{A})\,dV\)`],a:3,e:r`Divergence liên hệ thông lượng qua mặt kín S với tích phân \(\mathrm{div}\vec{A}\) trong thể tích V bao bởi S.`},
{q:r`Hệ thức nào sau đây luôn đúng?`,o:[r`\(\mathrm{div}(\mathrm{rot}\vec{A})=0\)`,r`\(\mathrm{div}(\mathrm{rot}\vec{A})=1\)`,r`\(\mathrm{div}(\mathrm{rot}\vec{A})=\vec{A}\)`,r`\(\mathrm{div}(\mathrm{rot}\vec{A})=\Delta\vec{A}\)`],a:0,e:r`\(\mathrm{div}(\mathrm{rot}\vec{A})=\nabla\cdot(\nabla\times\vec{A})=0\)`},
{q:r`Hệ thức nào sau đây luôn đúng?`,o:[r`\(\mathrm{rot}(\mathrm{grad}f)=\mathrm{grad}f\)`,r`\(\mathrm{rot}(\mathrm{grad}f)=\Delta f\)`,r`\(\mathrm{rot}(\mathrm{grad}f)=1\)`,r`\(\mathrm{rot}(\mathrm{grad}f)=0\)`],a:3,e:r`\(\mathrm{rot}(\mathrm{grad}f)=\nabla\times(\nabla f)=0\)`},
{q:r`Toán tử Laplace tác dụng lên một vectơ được tính bằng:`,o:[r`\(\Delta\vec{A}=\mathrm{rot}(\mathrm{grad}\vec{A})-\mathrm{div}(\mathrm{rot}\vec{A})\)`,r`\(\Delta\vec{A}=\mathrm{grad}(\mathrm{div}\vec{A})-\mathrm{rot}(\mathrm{rot}\vec{A})\)`,r`\(\Delta\vec{A}=\mathrm{div}(\mathrm{grad}\vec{A})+\mathrm{rot}(\mathrm{rot}\vec{A})\)`,r`\(\Delta\vec{A}=\mathrm{grad}(\mathrm{div}\vec{A})+\mathrm{rot}(\mathrm{rot}\vec{A})\)`],a:1,e:r`Theo slide: \(\Delta\vec{A}=\mathrm{grad}(\mathrm{div}\vec{A})-\mathrm{rot}(\mathrm{rot}\vec{A})\).`},
{q:r`Trường điện từ là một dạng vật chất cơ bản, chuyển động với vận tốc C:`,o:[r`Trong mọi môi trường vật chất`,r`Chỉ trong điện môi`,r`Trong chân không, trong mọi hệ quy chiếu quán tính`,r`Chỉ trong vật dẫn`],a:2,e:r`Slide Khái niệm: chuyển động với vận tốc C trong mọi hệ quy chiếu quán tính trong chân không.`},
{q:r`Mô hình toán học của trường điện từ gồm:`,o:[r`Chỉ định luật Gauss`,r`Hệ phương trình Maxwell và các điều kiện bờ (biên)`,r`Chỉ định luật Faraday`,r`Định luật Ohm và định luật Joule`],a:1,e:r`Mô hình vật lý là hệ tương tác TĐT – môi trường chất mang điện; mô hình toán học là hệ PT Maxwell và các điều kiện bờ (biên).`},
{q:r`Vectơ Poynting được định nghĩa là:`,o:[r`\(\vec{P}=\vec{E}+\vec{H}\)`,r`\(\vec{P}=\vec{E}\times\vec{H}\)`,r`\(\vec{P}=\vec{E}\cdot\vec{H}\)`,r`\(\vec{P}=\vec{D}\times\vec{B}\)`],a:1,e:r`Vectơ Poynting: \(\vec{P}=\vec{E}\times\vec{H}\).`},
{q:r`Cường độ dòng điện \(I\) chảy qua mặt S liên hệ với vectơ mật độ dòng điện \(\vec{J}\) bởi:`,o:[r`\(I=\int_S\vec{J}\cdot d\vec{S}\)`,r`\(I=\int_V\vec{J}\,dV\)`,r`\(I=\oint_C\vec{J}\cdot d\vec{l}\)`,r`\(I=\vec{J}\cdot l\)`],a:0,e:r`Vectơ mật độ dòng điện: \(I=\int_S\vec{J}\cdot d\vec{S}\).`},
{q:r`Lực tương tác điện từ tác dụng lên điện tích \(q\) chuyển động với vận tốc \(\vec{v}\) là:`,o:[r`\(\vec{F}=q\vec{E}\)`,r`\(\vec{F}=q\vec{v}\times\vec{B}\)`,r`\(\vec{F}=q\vec{E}-q\vec{v}\times\vec{B}\)`,r`\(\vec{F}=q\vec{E}+q\vec{v}\times\vec{B}\)`],a:3,e:r`\(\vec{F}=\vec{F}_e+\vec{F}_m=q\vec{E}+q\vec{v}\times\vec{B}\) (lực điện cộng lực từ).`},
{q:r`Vectơ cảm ứng điện \(\vec{D}\) trong môi trường điện môi được xác định bởi:`,o:[r`\(\vec{D}=\varepsilon_0\vec{E}-\vec{P}\)`,r`\(\vec{D}=\varepsilon_0\vec{E}+\vec{P}\)`,r`\(\vec{D}=\vec{P}/\varepsilon_0\)`,r`\(\vec{D}=\varepsilon\vec{E}-\vec{P}\)`],a:1,e:r`\(\vec{D}=\varepsilon_0\vec{E}+\vec{P}=\varepsilon_0(1+\chi_e)\vec{E}=\varepsilon\vec{E}\)`},
{q:r`Mật độ năng lượng điện trường được tính bằng:`,o:[r`\(w_e=\dfrac12\vec{E}\cdot\vec{D}\)`,r`\(w_e=\dfrac12\vec{H}\cdot\vec{B}\)`,r`\(w_e=\vec{E}\times\vec{H}\)`,r`\(w_e=\vec{J}\cdot\vec{E}\)`],a:0,e:r`\(w_e=\dfrac12\vec{E}\cdot\vec{D}\); mật độ năng lượng từ trường \(w_m=\dfrac12\vec{H}\cdot\vec{B}\).`},
{q:r`Điều kiện biên đối với thành phần tiếp tuyến của điện trường là:`,o:[r`\(E_{1t}-E_{2t}=\sigma\)`,r`\(E_{1t}-E_{2t}=J_s\)`,r`\(E_{1t}-E_{2t}=0\)`,r`\(E_{1t}+E_{2t}=0\)`],a:2,e:r`\(E_{1t}-E_{2t}=0\) (thành phần tiếp tuyến của \(\vec{E}\) liên tục); còn \(H_{1t}-H_{2t}=J_s\).`},
{q:r`Theo định luật Ohm dạng vi phân \(\vec{J}=\gamma\vec{E}\), mật độ công suất tiêu tán \(p\) trong vật dẫn bằng:`,o:[r`\(p=\gamma J^2\)`,r`\(p=\vec{J}\cdot\vec{E}=\gamma E^2=\dfrac{J^2}{\gamma}\)`,r`\(p=\dfrac{E^2}{\gamma}\)`,r`\(p=\dfrac{J}{\gamma}\)`],a:1,e:r`\(p=\vec{J}\cdot\vec{E}\), kết hợp \(\vec{J}=\gamma\vec{E}\) suy ra \(p=\gamma E^2=\dfrac{J^2}{\gamma}\).`},
{q:r`Dạng vi phân của định luật cảm ứng điện từ Faraday là:`,o:[r`\(\mathrm{rot}\vec{H}=\vec{J}+\dfrac{\partial\vec{D}}{\partial t}\)`,r`\(\mathrm{div}\vec{D}=\rho\)`,r`\(\mathrm{rot}\vec{E}=-\dfrac{\partial\vec{B}}{\partial t}\)`,r`\(\mathrm{div}\vec{B}=0\)`],a:2,e:r`Faraday: sức điện động cảm ứng bằng và ngược chiều tốc độ biến thiên từ thông, dạng vi phân \(\mathrm{rot}\vec{E}=-\dfrac{\partial\vec{B}}{\partial t}\).`},
{q:r`Trong phương trình \(\mathrm{rot}\vec{H}=\vec{J}+\dfrac{\partial\vec{D}}{\partial t}\), thành phần \(\dfrac{\partial\vec{D}}{\partial t}\) được gọi là:`,o:[r`Mật độ dòng điện dẫn`,r`Mật độ điện tích khối`,r`Mật độ dòng điện chuyển dịch (dòng điện dịch)`,r`Mật độ từ thông`],a:2,e:r`Trong định luật Ampere–Maxwell, \(\vec{J}_d=\dfrac{\partial\vec{D}}{\partial t}\) là mật độ dòng điện chuyển dịch (dòng điện dịch).`},
{q:r`Phương trình dạng vi phân của định luật Gauss đối với điện trường là:`,o:[r`\(\mathrm{div}\vec{B}=0\)`,r`\(\mathrm{div}\vec{J}=-\dfrac{\partial\rho}{\partial t}\)`,r`\(\mathrm{rot}\vec{E}=0\)`,r`\(\mathrm{div}\vec{D}=\rho\)`],a:3,e:r`Gauss điện: thông lượng \(\vec{D}\) qua mặt kín bằng tổng điện tích tự do bên trong, dạng vi phân \(\mathrm{div}\vec{D}=\rho\).`},
{q:r`Định luật Gauss đối với từ trường cho biết thông lượng của vectơ cảm ứng từ \(\vec{B}\) qua mặt kín S bất kỳ:`,o:[r`Bằng tổng điện tích bên trong S`,r`Luôn bằng không`,r`Bằng cường độ dòng điện qua S`,r`Luôn dương`],a:1,e:r`\(\oint_S\vec{B}\cdot d\vec{S}=0\), dạng vi phân \(\mathrm{div}\vec{B}=0\): thông lượng của \(\vec{B}\) luôn chảy liên tục.`},
{q:r`Phương trình liên tục hóa (mô hình toán học của định luật bảo toàn điện tích) là:`,o:[r`\(\mathrm{div}\vec{J}=\dfrac{\partial\rho}{\partial t}\)`,r`\(\mathrm{div}\vec{J}=\rho\)`,r`\(\mathrm{div}\vec{J}=-\dfrac{\partial\rho}{\partial t}\)`,r`\(\mathrm{rot}\vec{J}=-\dfrac{\partial\rho}{\partial t}\)`],a:2,e:r`Nếu điện tích trong V giảm thì có dòng điện chảy ra ngoài S: \(\mathrm{div}\vec{J}=-\dfrac{\partial\rho}{\partial t}\).`},
{q:r`Với trường điện từ dừng (\(\dfrac{\partial}{\partial t}=0\) và \(\vec{J}\neq0\)), điện trường có tính chất:`,o:[r`Xoáy`,r`Thế (\(\mathrm{rot}\vec{E}=0\))`,r`Biến thiên theo thời gian`,r`Không tồn tại`],a:1,e:r`Từ phương trình (2) với \(\dfrac{\partial}{\partial t}=0\) suy ra \(\mathrm{rot}\vec{E}=0\) nên điện trường chỉ có tính chất thế; từ trường vẫn có tính chất xoáy (\(\mathrm{rot}\vec{H}=\vec{J}\)).`},
{q:r`Với trường điện từ tĩnh (\(\dfrac{\partial}{\partial t}=0\) và \(\vec{J}=0\)), quan hệ giữa điện trường và từ trường là:`,o:[r`Gắn bó mật thiết với nhau`,r`Từ trường sinh ra điện trường`,r`Độc lập với nhau, cả hai đều có tính chất thế`,r`Điện trường xoáy, từ trường thế`],a:2,e:r`Khi \(\mathrm{rot}\vec{H}=0\) và \(\mathrm{rot}\vec{E}=0\), điện trường và từ trường hoàn toàn độc lập với nhau, cả hai đều có tính chất thế, không có tính chất xoáy.`}
];
const qz=document.getElementById("qz");
let h='';
D.forEach((it,i)=>{
  let o='';
  it.o.forEach((t,j)=>{o+=`<li><label id="l${i}_${j}"><input type="radio" name="q${i}" value="${j}" onchange="pick(${i},${j})"><span>${t}</span></label></li>`;});
  h+=`<div class="qb"><div class="qt">Câu ${i+1}: ${it.q}</div><ul class="opts">${o}</ul><div id="e${i}" class="exp"><strong>Giải thích:</strong> ${it.e}</div></div>`;
});
qz.innerHTML=h;
if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise();}
let done=0,right=0;
function pick(i,j){
  const it=D[i];
  document.getElementById(`l${i}_${it.a}`).classList.add('ok');
  if(j===it.a){right++;}else{document.getElementById(`l${i}_${j}`).classList.add('bad');}
  document.getElementById(`e${i}`).style.display='block';
  document.querySelectorAll(`input[name="q${i}"]`).forEach(x=>x.disabled=true);
  done++;
  document.getElementById('sub').textContent=`Đã làm ${done}/${D.length} câu • Đúng ${right}`;
}
function submitQuiz(){
  let s=0;
  D.forEach((it,i)=>{
    const sel=document.querySelector(`input[name="q${i}"]:checked`);
    it.o.forEach((_,j)=>document.getElementById(`l${i}_${j}`).classList.remove('ok','bad'));
    document.getElementById(`l${i}_${it.a}`).classList.add('ok');
    if(sel){const u=parseInt(sel.value);if(u===it.a){s++;}else{document.getElementById(`l${i}_${u}`).classList.add('bad');}}
    document.getElementById(`e${i}`).style.display='block';
    document.querySelectorAll(`input[name="q${i}"]`).forEach(x=>x.disabled=true);
  });
  const rs=document.getElementById('res');
  rs.innerHTML=`Bạn đạt ${s} / ${D.length} điểm!`;
  rs.style.display='block';
  rs.scrollIntoView({behavior:'smooth',block:'center'});
}

<script>
const r=String.raw;
const X=r`\vec{i}_x`,Y=r`\vec{i}_y`,Z=r`\vec{i}_z`,R=r`\vec{i}_r`,P=r`\vec{i}_\phi`,T=r`\vec{i}_\theta`;

let done=0,right=0;

  document.getElementById(`e${i}`).style.display='block';
  document.querySelectorAll(`input[name="q${i}"]`).forEach(x=>x.disabled=true);
  done++;
  document.getElementById('sub').textContent=`Đã làm ${done}/${D.length} câu • Đúng ${right}`;
}
function submitQuiz(){
  let s=0;
  D.forEach((it,i)=>{
    const sel=document.querySelector(`input[name="q${i}"]:checked`);
    it.o.forEach((_,j)=>document.getElementById(`l${i}_${j}`).classList.remove('ok','bad'));
    document.getElementById(`l${i}_${it.a}`).classList.add('ok');
    if(sel){const u=parseInt(sel.value);if(u===it.a){s++;}else{document.getElementById(`l${i}_${u}`).classList.add('bad');}}
    document.getElementById(`e${i}`).style.display='block';
    document.querySelectorAll(`input[name="q${i}"]`).forEach(x=>x.disabled=true);
  });
  const rs=document.getElementById('res');
  rs.innerHTML=`Bạn đạt ${s} / ${D.length} điểm!`;
  rs.style.display='block';
  rs.scrollIntoView({behavior:'smooth',block:'center'});
}
